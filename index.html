<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prueba Diagnóstico</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <div style="position: fixed; top: 20px; width: 100%; text-align: center; z-index: 10; color: white; background: rgba(0,0,0,0.8); padding: 10px;">
        Prueba Cubo Azul (Buscando marcador...)
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;">
        
        <a-marker type="pattern" url="pattern-trofeo_CF_black.patt">
            
            <a-box position="0 0.5 0" material="color: blue; opacity: 0.9;" scale="1.5 1.5 1.5"></a-box>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
