<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prueba Raw CF</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <div style="position: fixed; top: 10px; width: 100%; text-align: center; z-index: 10; color: white; background: rgba(0,0,0,0.8); padding: 10px;">
        Leyendo archivo crudo (Cubo Rojo)
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker type="pattern" url="https://raw.githubusercontent.com/Gabyagabs/reconocimiento-CF2026/main/pattern-cf2.patt">
            
            <a-box position="0 0.5 0" color="red" scale="1.5 1.5 1.5"></a-box>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
