<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reconocimiento CF 2026</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">
    <div style="position: fixed; top: 20px; width: 100%; text-align: center; z-index: 10; color: white; background: rgba(0,0,0,0.5); padding: 10px;">
        Enfoca el marcador impreso
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker type="pattern" url="pattern-trofeo_CF.patt">
            
            <a-box position="0 0.5 0" material="color: red; opacity: 0.8;" scale="1 1 1"></a-box>
            
            <a-image 
                src="trofeo_CF_ch.gif" 
                position="0 1.5 0" 
                rotation="-90 0 0" 
                width="2" 
                height="2">
            </a-image>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
